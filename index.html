<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lista de Chá de Casa Nova</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container my-4">
    <h1 class="text-center">Lista de Chá de Casa Nova 💜</h1>
    <div id="lista-container"></div>
    <div class="text-center mt-4">
      <button id="btn-confirmar" class="btn btn-primary d-none" data-bs-toggle="modal" data-bs-target="#modalConfirmar">Confirmar Seleção</button>
    </div>
  </div>

  <div class="modal fade" id="modalConfirmar" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalLabel">Confirme suas informações</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <form id="form-confirmar">
            <div class="mb-3">
              <label for="nome" class="form-label">Seu nome</label>
              <input type="text" class="form-control" id="nome" required>
            </div>
            <div class="mb-3">
              <label for="whatsapp" class="form-label">Seu WhatsApp (com DDD)</label>
              <input type="tel" class="form-control" id="whatsapp" required>
            </div>
            <button type="submit" class="btn btn-success">Enviar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="lista.js"></script>
  <script src="script.js"></script>
</body>
</html>
